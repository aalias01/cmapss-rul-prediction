name: cmapss-rul
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pandas>=2.0.0
  - numpy>=1.24.0
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - scikit-learn>=1.3.0
  - joblib>=1.3.0
  - jupyter
  - notebook
  - ipykernel
  - pip
  - pip:
      # Pinned: must match requirements.txt — the committed model artifact
      # (models/xgb_rul.joblib) is a pickle tied to this XGBoost version.
      - xgboost==3.2.0
      # shap is used in notebooks only (summary plot); the API uses
      # XGBoost's built-in TreeSHAP and does not import shap.
      - shap>=0.44.0
      - fastapi>=0.110.0
      - uvicorn[standard]>=0.27.0
      - pydantic>=2.0.0
      - python-multipart>=0.0.9
