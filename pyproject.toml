[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks", "figures"]

[tool.ruff.lint]
# Pyflakes (F), import sorting (I), whitespace (W), and the meaningful
# pycodestyle error groups. E501 is left off so the aligned Field blocks
# in api/schemas.py stay readable.
select = ["E4", "E7", "E9", "F", "W", "I"]
